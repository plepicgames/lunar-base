name: Problem in the game
description: Something went wrong while you played Lunar Base online.
title: "[game] "
labels: ["game-problem"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for telling us. This report is public: anyone can read it.
        Do not write a password, an e-mail address or anything else private.

        If you opened this page from the game, the fields at the bottom are
        already filled in. Please leave them as they are.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Say what you did and what the game did. A screenshot helps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: game-id
    attributes:
      label: Game ID
      description: Filled in by the game. Leave it empty if the problem was not in a game.
  - type: input
    id: turn
    attributes:
      label: Turn
      description: The turn number when you opened this form.
  - type: input
    id: screen
    attributes:
      label: Screen
      description: Where you were, for example lobby, table or result.
  - type: input
    id: build
    attributes:
      label: Game version
      description: Shown at the bottom of the game, after "Version".
  - type: input
    id: browser
    attributes:
      label: Browser
      description: Filled in by the game. Otherwise the name of your browser and device.
  - type: checkboxes
    id: no-personal-data
    attributes:
      label: Before you send
      options:
        - label: This report contains no personal data and no password
          required: true
