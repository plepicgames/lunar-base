---
name: Validate

'on':
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # `gitleaks git` reads the full history.
          fetch-depth: 0
          persist-credentials: false

      - name: Lint the workflows
        run: |
          set -euo pipefail
          pip install zizmor==1.29.0
          zizmor .github/workflows/

      - name: Lint the shell scripts
        run: |
          set -euo pipefail
          shellcheck -- .githooks/pre-commit

      - name: Check documentation links
        # lycheeverse/lychee-action v2.9.0
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8
        with:
          args: --no-progress --config lychee.toml './**/*.md'
          fail: true

      - name: Set up Node.js
        # actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"

      - name: Check the Node.js version
        run: |
          set -euo pipefail
          node --version
          node -e '
            const [major, minor] = process.versions.node.split(".").map(Number);
            if (major < 24 || (major === 24 && minor < 15)) {
              console.error("Lunar Base requires Node.js 24.15 or newer.");
              process.exit(1);
            }
          '

      - name: Install locked dependencies
        run: npm ci

      - name: Run canonical validation
        run: |
          set -euo pipefail
          bash scripts/validate

      - name: Download pinned gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: >-
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          ./gitleaks git --redact --verbose

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        # actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"

      - name: Check the Node.js version
        run: |
          set -euo pipefail
          node --version
          node -e '
            const [major, minor] = process.versions.node.split(".").map(Number);
            if (major < 24 || (major === 24 && minor < 15)) {
              console.error("Lunar Base requires Node.js 24.15 or newer.");
              process.exit(1);
            }
          '

      # `start.sh --prepare` runs `npm ci` and records the lock file it
      # installed from, so `npm start` under the tests does not install again.
      - name: Install locked dependencies
        run: |
          set -euo pipefail
          bash scripts/start.sh --prepare

      # The Chromium build that the pinned `@playwright/test` drives. The
      # tests themselves never download a browser; see `playwright.config.ts`.
      - name: Install Chromium and its system packages
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium

      - name: Run the browser tests
        run: |
          set -euo pipefail
          npx playwright test
