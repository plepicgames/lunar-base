---
name: Release

# Builds the game's image from merged `main`, publishes it, and promotes its
# digest into the live environment, the only one the game has.
#
# **Every run restarts the single replica and ends the games in progress.** So
# the workflow runs only when a file the image is built from changes: a merge
# that touches documents or tests alone must not deploy. The `paths` list below
# holds every file the allow-list in `.dockerignore` admits, and also the
# files that decide how a release runs: the two scripts, the `Dockerfile` and
# this workflow. Change both lists together.
#
# There is no approval step beyond the `live` GitHub Environment: the merge is
# the approval. A manual run is accepted from `main` only; `gate` refuses any
# other ref.
#
# The job split keeps the credential away from the code. `gate` checks out
# nothing and reads the reviewed digest guard through the API. `build` runs
# repository code and holds no GitOps credential. `promote` holds the
# credential, a GitHub App token minted for `hannosirkel/deploys` alone, and
# brings no code of this repository into the job but that guard.

'on':
  push:
    branches:
      - main
    paths:
      - src/**
      - assets/**
      - docs/design/cards.json
      - package.json
      - package-lock.json
      - .npmrc
      - vite.config.ts
      - tsconfig.base.json
      - Dockerfile
      - .dockerignore
      - scripts/smoke-image.sh
      - scripts/update-gitops-digest.sh
      - .github/workflows/release.yml
      # Tests and their fixtures are in no image.
      - '!src/**/*.test.ts'
      - '!src/**/*.test.tsx'
      - '!src/**/__snapshots__/**'
      - '!src/**/testing/**'
      - '!src/**/scenarios/**'
  workflow_dispatch:

# One promotion at a time: two releases never write the overlay interleaved.
concurrency:
  group: lunar-base-gitops-promotion
  cancel-in-progress: false

permissions: {}

jobs:
  # The gate and the browser tests that `validate.yml` runs on a pull request.
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the pushed revision
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        # actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"

      # `start.sh --prepare` checks the Node.js version, runs `npm ci` and
      # records the lock file, so `npm start` under the browser tests does not
      # install again.
      - name: Install locked dependencies
        run: |
          set -euo pipefail
          bash scripts/start.sh --prepare

      - name: Run canonical validation
        run: |
          set -euo pipefail
          bash scripts/validate

      - name: Install Chromium and its system packages
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium

      - name: Run the browser tests
        run: |
          set -euo pipefail
          npx playwright test

  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      guard: ${{ steps.verify.outputs.guard }}
      source_sha: ${{ steps.verify.outputs.source_sha }}
    steps:
      - name: Read the digest guard from the pushed revision
        id: verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          api='https://api.github.com'
          headers=(
            --header "Authorization: Bearer $GITHUB_TOKEN"
            --header 'Accept: application/vnd.github+json'
            --header 'X-GitHub-Api-Version: 2022-11-28'
          )

          # A manual run can name any branch. Only `main` is released.
          if [ "$SOURCE_REF" != refs/heads/main ]; then
            echo "release refused: $SOURCE_REF is not refs/heads/main" >&2
            exit 1
          fi
          printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'

          # Read rather than check out. The guard is the one file from this
          # repository the credentialed job executes, and fetching it as bytes
          # is what keeps that job free of a working tree it could run
          # anything else from.
          guard_response="$(curl --fail --silent --show-error "${headers[@]}" \
            "${api}/repos/${REPOSITORY}/contents/scripts/update-gitops-digest.sh?ref=${SOURCE_SHA}")"
          jq -e '
            .type == "file" and
            .encoding == "base64" and
            (.content | type == "string")
          ' >/dev/null <<<"$guard_response"
          guard="$RUNNER_TEMP/update-gitops-digest.sh"
          trap 'rm -f -- "$guard"' EXIT
          jq -er '.content | gsub("\\n"; "")' <<<"$guard_response" \
            | base64 --decode >"$guard"
          grep -qx '#!/bin/sh' "$guard"
          guard_content="$(base64 --wrap=0 "$guard")"

          echo "source_sha=$SOURCE_SHA" >>"$GITHUB_OUTPUT"
          echo "guard=$guard_content" >>"$GITHUB_OUTPUT"

  build:
    needs: [validate, gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      IMAGE: ghcr.io/plepicgames/lunar-base
      SOURCE_SHA: ${{ needs.gate.outputs.source_sha }}
    steps:
      - name: Check out the validated revision
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.gate.outputs.source_sha }}
          persist-credentials: false

      - name: Set up the attestation-capable Buildx driver
        # docker/setup-buildx-action v4.2.0
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin

      # `LUNAR_BUILD` is the commit: the version the client shows and the
      # server logs. The `Dockerfile` carries the
      # `org.opencontainers.image.source` label that links the package to this
      # repository.
      - name: Build and publish the image
        id: build
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/image.json"
          docker buildx build --platform linux/amd64 \
            --provenance=mode=min --sbom=true \
            --build-arg "LUNAR_BUILD=$SOURCE_SHA" \
            --tag "${IMAGE}:sha-${SOURCE_SHA}" \
            --push --metadata-file "$metadata" .
          digest="$(jq -er '."containerimage.digest"' "$metadata")"
          printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          echo "digest=$digest" >>"$GITHUB_OUTPUT"

      # The published digest, run the way the cluster runs it: user 10001, a
      # read-only root filesystem, the log volume, the public base path. It
      # must answer the health path and stop with code 0 on SIGTERM.
      - name: Run the published digest as the cluster will
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          bash scripts/smoke-image.sh "${IMAGE}@${DIGEST}" "$SOURCE_SHA"

      - name: Scan the published digest
        # aquasecurity/trivy-action v0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ghcr.io/plepicgames/lunar-base@${{ steps.build.outputs.digest }}
          format: json
          output: trivy-lunar-base.json
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
          scanners: vuln
          version: v0.75.0

      - name: Retain the vulnerability report
        if: ${{ always() && hashFiles('trivy-lunar-base.json') != '' }}
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: trivy-live-${{ needs.gate.outputs.source_sha }}
          path: trivy-lunar-base.json
          if-no-files-found: error
          retention-days: 7

  promote:
    needs: [validate, gate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: live
    permissions: {}
    env:
      DIGEST: ${{ needs.build.outputs.digest }}
      SOURCE_SHA: ${{ needs.gate.outputs.source_sha }}
    steps:
      # The operator reuses the shop's deployer app: the `live` environment
      # holds its credential under the shop's two secret names.
      - name: Mint repository-scoped GitHub App token
        id: app-token
        env:
          APP_CLIENT_ID: ${{ secrets.PLEPIC_DEPLOYER_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.PLEPIC_DEPLOYER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/plepic-deployer.pem"
          trap 'rm -f -- "$key"' EXIT
          printf '%s' "$APP_PRIVATE_KEY" >"$key"

          b64url() {
            openssl base64 -A | tr '+/' '-_' | tr -d '='
          }
          now="$(date +%s)"
          header="$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | b64url)"
          payload="$(jq -cn --arg iss "$APP_CLIENT_ID" \
            --argjson iat "$((now - 60))" --argjson exp "$((now + 540))" \
            '{iat:$iat,exp:$exp,iss:$iss}' | b64url)"
          unsigned="${header}.${payload}"
          signature="$(printf '%s' "$unsigned" \
            | openssl dgst -sha256 -sign "$key" -binary | b64url)"
          jwt="${unsigned}.${signature}"
          github_api=https://api.github.com
          repository=hannosirkel/deploys

          installation_id="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $jwt" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${github_api}/repos/${repository}/installation" \
            | jq -er '.id')"
          token="$(curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $jwt" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            --data '{"repositories":["deploys"],"permissions":{"contents":"write"}}' \
            "${github_api}/app/installations/${installation_id}/access_tokens" \
            | jq -er '.token')"
          echo "::add-mask::$token"
          echo "token=$token" >>"$GITHUB_OUTPUT"

      - name: Check out only the GitOps state
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hannosirkel/deploys
          token: ${{ steps.app-token.outputs.token }}
          path: gitops
          persist-credentials: false

      - name: Apply the exact live image digest
        env:
          GUARD_CONTENT: ${{ needs.gate.outputs.guard }}
        run: |
          set -euo pipefail
          guard="$RUNNER_TEMP/update-gitops-digest.sh"
          printf '%s' "$GUARD_CONTENT" | base64 --decode >"$guard"
          chmod 0700 "$guard"
          "$guard" "$DIGEST" "$GITHUB_WORKSPACE/gitops/lunar-base/overlays/live"

      # The GitOps standard: every manifest change renders and schema-checks
      # before it can reach Argo CD. The version, the checksum and the
      # Kubernetes version are the ones `hannosirkel/deploys` validates with.
      # The binary stays outside the checkout, which must hold one change.
      - name: Download pinned kubeconform and validate schemas
        env:
          KUBECONFORM_VERSION: 0.8.0
          KUBECONFORM_SHA256: >-
            9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
          # The Orange cluster's Kubernetes version, as `deploys` pins it.
          KUBERNETES_VERSION: 1.36.2
        working-directory: gitops
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/kubeconform-linux-amd64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" kubeconform
          kubectl kustomize lunar-base/overlays/live \
            | "$RUNNER_TEMP/kubeconform" \
                -kubernetes-version "${KUBERNETES_VERSION}" \
                -strict -summary

      - name: Commit and push the GitOps update
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        working-directory: gitops
        run: |
          set -euo pipefail
          git config user.name 'plepic-deployer[bot]'
          git config user.email \
            'plepic-deployer[bot]@users.noreply.github.com'
          bash lunar-base/tests/manifests.sh
          kubectl kustomize lunar-base/overlays/live >/dev/null
          git diff --check
          git add lunar-base/overlays/live/kustomization.yaml
          staged="$(git diff --cached --name-only)"
          if [ -z "$staged" ]; then
            echo 'live overlay already records the digest: nothing to promote'
            exit 0
          fi
          [ "$staged" = 'lunar-base/overlays/live/kustomization.yaml' ]
          [ -z "$(git status --porcelain | grep -v '^M  ' || true)" ]
          git diff --cached --check
          git commit -m "deploy(live): lunar-base ${SOURCE_SHA} ${DIGEST}"
          git push "https://x-access-token:${APP_TOKEN}@github.com/hannosirkel/deploys.git" \
            HEAD:main

      # The token would expire by itself within the hour. Revoking it ends its
      # use when the job ends, also when a step above failed.
      - name: Revoke the GitHub App token
        if: ${{ always() && steps.app-token.outputs.token != '' }}
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --request DELETE \
            --header "Authorization: Bearer $APP_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/installation/token
